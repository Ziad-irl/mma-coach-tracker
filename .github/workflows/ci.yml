name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    # Same interpreter the coach's PC runs: 32-bit Python 3.8.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x86

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build exe
        run: |
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name MMACoachTracker launcher.py

      - uses: actions/upload-artifact@v4
        with:
          name: MMACoachTracker-win32
          path: dist/MMACoachTracker
